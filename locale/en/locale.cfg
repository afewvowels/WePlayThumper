[item-name]
wp-thumper-equipment=Thumper

[item-description]
wp-thumper-equipment=A piston backpack that slams the ground when enemies close in. A shockwave of heaving dirt and dust rolls outward, shoves them back and leaves the ground cracked. One per equipment grid.

[equipment-name]
wp-thumper-equipment=Thumper

[equipment-description]
wp-thumper-equipment=Thumps automatically when enemy units come within 10 tiles, as long as you're on the ground (not jetpacking or hovering in mech armor). Charges from the grid between thumps. One per equipment grid.

[technology-name]
wp-thumper-equipment=Thumper

[technology-description]
wp-thumper-equipment=Personal crowd control: a piston that hits the ground hard enough to knock biters back. It buys you time, not immunity.

[mod-setting-name]
wp-thumper-knockback=Knockback (%)
wp-thumper-damage=Damage (%)
wp-thumper-scar-seconds=Scar duration (seconds)
wp-thumper-rough-strength-pct=Cracked ground slowdown strength (%)
wp-thumper-rough-hard-mode=Hard mode: cracked ground slows players too
wp-thumper-sound=Thumper sounds
wp-thumper-graphics=Thumper visual effects

[mod-setting-description]
wp-thumper-knockback=How far the shockwave shoves enemies and how long it staggers them. 0 turns knockback off.
wp-thumper-damage=How hard the shockwave hits. 100% is a light 8 physical damage per thump, before resistances.
wp-thumper-scar-seconds=How long each thump's crater and cracked ground stay before they fade out (over 30 seconds). Thumping again in the same spot keeps them fresh.
wp-thumper-rough-strength-pct=Enemies on your newest patch of cracked ground are slowed (older patches are just scenery). 100% = 50% slower, 50% = 25% slower, 0 turns it off. Enemies Thumper has hit again and again shrug it off a little: each recent thump takes 10% off their slowdown, but they never get back to full speed. Players are only slowed in hard mode (by the full amount), and vehicles never are.
wp-thumper-rough-hard-mode=Off (default): only enemies are slowed on cracked ground.\nOn: players are slowed on it too, by the same amount, unless their armor has an exoskeleton (or any other equipment that gives a movement bonus). Players in vehicles or in the air (jetpack, hovering mech armor) aren't affected.
wp-thumper-sound=Hear Thumper's thump and rumble. Only affects you.
wp-thumper-graphics=See Thumper's shockwave, dust, craters and cracked ground. Only affects you; the shockwave still works with this off.

[wp-thumper]
one-per-grid=Only one Thumper fits in each equipment grid.
